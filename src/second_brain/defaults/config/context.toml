# context.toml — context governor and working-set defaults
# Status: documented defaults; NOT WIRED — no live runtime reader yet
# (see proof/reports/config-consumption.md); wiring planned in later phases.
schema_version = 1

[governor]
# PLANNED — no runtime module reads these bands yet: the existing context
# pressure monitor (src/second_brain/monitor.py) uses hardcoded 50/80
# boundaries; wiring governor bands is out of scope for this pass
# (see proof/reports/config-consumption.md).
green_until_pct = 60
yellow_until_pct = 75
orange_until_pct = 85
# above orange_until_pct => RED
actions = ["normal", "restrict_broad_reads", "distill_offload", "checkpoint",
           "compact_handoff"]

[read_ledger]
# repeated reads are allowed when needed; ledger enables prior compact reference
track = ["path", "hash", "range", "purpose", "turn", "artifact"]

[working_set]
dir = "state/sessions"          # per-session working set
files = ["active-state.json", "requirements.json", "read-ledger.json",
         "tool-ledger.json", "routing.json", "environment.json"]

[capsule]
# Active State Capsule is updated at meaningful checkpoints, not every token.
min_update_interval_seconds = 30

[rtd]
# Reversible Tool Distillation (Phase 5) — SHADOW MODE (no substitution).
# threshold_chars: ENFORCED — the Prime extension resolves the RTD size
# threshold as env SECOND_BRAIN_RTD_THRESHOLD (highest) -> this file value ->
# source default 8000 (see brainstem/prime-extension/src/rtd.ts parseThreshold
# and config.ts rtdThresholdFromConfig).
threshold_chars = 8000
# The keys below are INFORMATIONAL only (NOT configurable): the extension
# reads only threshold_chars plus its own source constants. enabled /
# max_distill_chars / whitelist_tools / whitelist_commands are NOT read at
# runtime — tool/command eligibility is fixed in rtd.ts RTD_COMMAND_PREFIXES
# and the env gate SECOND_BRAIN_RTD (see proof/reports/config-consumption.md).
enabled = false
max_distill_chars = 2000
whitelist_tools = ["bash"]
whitelist_commands = ["pytest", "git", "rg", "grep"]

[reserve]
# Completion Reserve / Memory Budget Ceiling (v4.2 §95.1) — documented
# defaults; NOT WIRED (no runtime reader; retrieved_memory_pct_max is the plan's
# retrieval-budget ceiling but is not yet enforced — see
# proof/reports/config-consumption.md and plan Phase 11).
task_execution_pct_min = 70      # current task/source/test execution
verification_reserve_pct = 5     # verification/recovery/handoff reserve
retrieved_memory_pct_max = 20    # max optional retrieved Brain context
degrade_order = ["tier4_memories", "tier3_memories", "dedupe_memories",
                 "shrink_scout_summaries", "offload_tool_history",
                 "keep_requirements", "keep_exact_source", "keep_tests_errors",
                 "keep_rollback_state"]
