# brain.toml — core Brain identity and local-storage defaults
# Status: documented defaults; NOT WIRED — no live runtime reader yet
# (see proof/reports/config-consumption.md); wiring planned in later phases.
schema_version = 1

[brain]
name = "The Second Brain"
# Canonical home is resolved at runtime: $SECOND_BRAIN_HOME, else
# %USERPROFILE%\Documents\The-Second-Brain. Never hardcode it here.

[db]
path = "db/brain.sqlite"        # relative to brain home
journal_mode = "WAL"
synchronous = "NORMAL"
foreign_keys = true

[backup]
# brainctl backup target (relative to brain home)
dir = "backups"
include_db = true
include_config = true
include_constitution = true
include_projects = true

[git]
# categories for commits about the Brain (see constitution/change-control.md)
categories = ["brain(core)", "brain(memory)", "brain(skill)", "brain(policy)",
              "brain(project)", "brain(immune)", "brain(db)", "brain(adapter)"]

[heartbeat]
mode = "shadow"
min_interval_seconds = 60
max_run_history = 256
