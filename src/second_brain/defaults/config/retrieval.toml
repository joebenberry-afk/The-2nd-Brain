# retrieval.toml — memory retrieval scoring defaults
# Status: documented defaults; NOT WIRED — no live runtime reader yet
# (see proof/reports/config-consumption.md); wiring planned in later phases.
# NOTE: committed search is semantic.search_memories substring scan; the scoring
# formula below is NOT executed. FTS5 + filters + dedupe + ranking are
# implemented in the worktree and in final validation (uncommitted, 2026-08-15);
# the retrieval.toml keys below remain unwired regardless.
schema_version = 1

[scoring]
# score = relevance * trust * freshness * scope_match * historical_utility
#         * predicted_decision_value * diversity_factor / token_cost
#         - negative_transfer_risk   (plan §26; categories first, not overfit)
components = ["relevance", "trust", "freshness", "scope_match",
              "historical_utility", "predicted_decision_value",
              "diversity_factor", "token_cost", "negative_transfer_risk"]
max_results = 5
log_all_components = true

[lateral_inhibition]
# prefer 1 current fact + 1 supporting failure + 1 conflicting historical note
# over 10 paraphrases of the same fact (plan §29)
deduplicate = true
surface_contradictions = true

[decay]
# strategic forgetting (plan §52): states, not deletion
states = ["HOT", "WARM", "COLD", "ARCHIVED"]
protected = ["constitution", "security", "accepted_decisions",
             "critical_failure_immunizations", "user_preferences",
             "current_invariants"]
