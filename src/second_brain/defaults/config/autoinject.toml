# autoinject.toml — P0 AutoInject configuration (plan §6.6, Phase 0C/0D/C)
# Status: ENFORCED — budget read by autoinject.load_config (python) on every
# prepare_injection; mode read by the Prime extension (autoinject.ts
# modeFromAutoinjectToml) on every event.
# Precedence: SECOND_BRAIN_AUTOINJECT_* env vars > this file > defaults.
schema_version = 1

# LIVE FLIP SWITCH: mode = "off" | "shadow" | "advisory" | "active".
# Edit here and the next event picks it up — no redeploy needed.
# Rollback = set mode back to "shadow".
[autoinject]
mode = "shadow"

[budget]
target_tokens = 800       # normal AutoInject target (~500-1000 per plan)
hard_cap_tokens = 2000    # absolute hard max per injection (plan: <= 2000)
