# environment.toml — Environment Steward defaults (Phase 8 consumes)
schema_version = 1

[track]
session_start = ["cwd", "repo", "branch", "head", "dirty_state", "worktree",
                 "language", "package_manager", "lockfiles", "tools",
                 "repowise_freshness", "children", "brain_version"]
during = ["dependency_installs", "processes", "temp_dirs", "worktrees",
          "config_mutation", "agent_spawns", "repeated_failure"]
shutdown = ["owned_process_leak", "untracked_junk", "active_children",
            "dirty_tree", "dependency_drift", "incomplete_verification"]

[process_ownership]
# never PID alone (plan §75)
fields = ["pid", "start_time", "executable", "ownership_token", "session_id"]
never_kill_ambiguous = true
