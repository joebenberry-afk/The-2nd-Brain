# Deterministic gates on every push for the Brain package (brain/).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  v4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --no-audit --no-fund
      - name: Lint, types, tests (incl. the frozen recall eval on the committed notes)
        run: |
          npx eslint src test
          npx tsc --noEmit
          npx vitest run
      - name: The brain command runs from the checkout under Node and Bun
        env:
          SECOND_BRAIN_HOME: ${{ github.workspace }}
        run: |
          node bin/brain.mjs check
          bun bin/brain.mjs card --project second-brain
