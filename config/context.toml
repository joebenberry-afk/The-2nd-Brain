# context.toml — context governor and working-set defaults
# Status: ENFORCED for [reserve].retrieved_memory_pct_max (read by
# semantic.load_retrieval_config as the retrieval token-budget ceiling); the
# remaining keys are documented defaults, NOT WIRED (see
# proof/reports/config-consumption.md).
schema_version = 1

[governor]
# PLANNED — no runtime module reads these bands yet: the existing context
# pressure monitor (src/second_brain/monitor.py) uses hardcoded 50/80
# boundaries; wiring governor bands is out of scope for this pass
# (see proof/reports/config-consumption.md).
green_until_pct = 60
yellow_until_pct = 75
orange_until_pct = 85
# above orange_until_pct => RED
actions = ["normal", "restrict_broad_reads", "distill_offload", "checkpoint",
           "compact_handoff"]

[read_ledger]
# repeated reads are allowed when needed; ledger enables prior compact reference
track = ["path", "hash", "range", "purpose", "turn", "artifact"]

[working_set]
dir = "state/sessions"          # per-session working set
files = ["active-state.json", "requirements.json", "read-ledger.json",
         "tool-ledger.json", "routing.json", "environment.json"]

[capsule]
# Active State Capsule is updated at meaningful checkpoints, not every token.
min_update_interval_seconds = 30

[rtd]
# Reversible Tool Distillation (P3-F) — substitution ACTIVE when enabled=true.
# threshold_chars: ENFORCED — the Prime extension resolves the RTD size
# threshold as env SECOND_BRAIN_RTD_THRESHOLD (highest) -> this file value ->
# source default 8000 (see brainstem/prime-extension/src/rtd.ts parseThreshold
# and config.ts rtdThresholdFromConfig).
threshold_chars = 8000
# P3-F: the fields below are now REAL for the RTD substitution surface
# (brainstem/prime-extension/src/config.ts loadRtdConfig + rtd.ts runRtd):
#   enabled            — master switch: substitution happens only when true;
#                        false = shadow measurement only (plan §11.3). Rollback
#                        = set back to false (no redeploy needed, per-event read).
#   max_distill_chars  — cap on the model-visible distilled block (plan §11.6).
#   whitelist_tools    — tools eligible (default ["bash"], plan §11.2).
#   whitelist_commands — first-token commands eligible (pytest/git/rg/grep).
# Raw results are preserved byte-exactly through the artifact store BEFORE any
# reduction and verified recoverable; preservation failure returns the ORIGINAL
# content unchanged (plan §11.4). Binary/non-text results are never distilled.
enabled = false
max_distill_chars = 2000
whitelist_tools = ["bash"]
whitelist_commands = ["pytest", "git", "rg", "grep"]

[reserve]
# Completion Reserve / Memory Budget Ceiling (v4.2 §95.1).
# ENFORCED: retrieved_memory_pct_max is read at runtime by
# semantic.load_retrieval_config as the retrieval token-budget hard ceiling
# (percent of the _CONTEXT_WINDOW_TOKENS = 200k assumption in semantic.py;
# lowest-value rows are trimmed after ranking, always keeping the best row).
# The remaining reserve keys are documented defaults; NOT WIRED yet.
task_execution_pct_min = 70      # current task/source/test execution
verification_reserve_pct = 5     # verification/recovery/handoff reserve
retrieved_memory_pct_max = 20    # max optional retrieved Brain context
degrade_order = ["tier4_memories", "tier3_memories", "dedupe_memories",
                 "shrink_scout_summaries", "offload_tool_history",
                 "keep_requirements", "keep_exact_source", "keep_tests_errors",
                 "keep_rollback_state"]
