# context.toml — context governor and working-set defaults
# Status: ENFORCED for [reserve].retrieved_memory_pct_max (read by
# semantic.load_retrieval_config as the retrieval token-budget ceiling); the
# remaining keys are documented defaults, NOT WIRED (see
# proof/reports/config-consumption.md).
schema_version = 1

[governor]
# PLANNED — no runtime module reads these bands yet: the existing context
# pressure monitor (src/second_brain/monitor.py) uses hardcoded 50/80
# boundaries; wiring governor bands is out of scope for this pass
# (see proof/reports/config-consumption.md).
green_until_pct = 60
yellow_until_pct = 75
orange_until_pct = 85
# above orange_until_pct => RED
actions = ["normal", "restrict_broad_reads", "distill_offload", "checkpoint",
           "compact_handoff"]

[read_ledger]
# repeated reads are allowed when needed; ledger enables prior compact reference
track = ["path", "hash", "range", "purpose", "turn", "artifact"]

[working_set]
dir = "state/sessions"          # per-session working set
files = ["active-state.json", "requirements.json", "read-ledger.json",
         "tool-ledger.json", "routing.json", "environment.json"]

[capsule]
# Active State Capsule is updated at meaningful checkpoints, not every token.
min_update_interval_seconds = 30

[rtd]
# Reversible Tool Distillation (P3-F) — substitution ACTIVE when enabled=true.
# threshold_chars: ENFORCED — the Prime extension resolves the RTD size
# threshold as env SECOND_BRAIN_RTD_THRESHOLD (highest) -> this file value ->
# source default 8000 (see brainstem/prime-extension/src/rtd.ts parseThreshold
# and config.ts rtdThresholdFromConfig).
threshold_chars = 8000
# P3-F: the fields below are now REAL for the RTD substitution surface
# (brainstem/prime-extension/src/config.ts loadRtdConfig + rtd.ts runRtd):
#   enabled            — master switch: substitution happens only when true;
#                        false = shadow measurement only (plan §11.3). Rollback
#                        = set back to false (no redeploy needed, per-event read).
#   max_distill_chars  — cap on the model-visible distilled block (plan §11.6).
#   whitelist_tools    — tools eligible (default ["bash"], plan §11.2).
#   whitelist_commands — first-token commands eligible (pytest/git/rg/grep).
# Raw results are preserved byte-exactly through the artifact store BEFORE any
# reduction and verified recoverable; preservation failure returns the ORIGINAL
# content unchanged (plan §11.4). Binary/non-text results are never distilled.
enabled = false
max_distill_chars = 2000
whitelist_tools = ["bash"]
whitelist_commands = ["pytest", "git", "rg", "grep"]

[vmem]
# Context Virtual Memory compaction-boundary bookkeeping (Phase R3).
# ENFORCED when enabled=true: brainstem/prime-extension/src/index.ts calls
# `second_brain vmem compact-prep`/`hot-context` at session_before_compact/
# session_compact (vmem.py §6.7 "Compaction barrier interaction" — VMem's
# own documented integration point). Advisory only: never cancels
# compaction, never touches model-visible context (see
# outputs/reports/rc4/02-prime-live-callgraph.md for why the `context` event
# itself is not yet wired to a message-level replacement).
# Rollback = set back to false (no redeploy needed, per-event read).
enabled = false
budget_tokens = 1500

[vmem_admission]
# VMem session-object admission (pilot-2 prep, RC4 amendment).
# ENFORCED when enabled=true: brainstem/prime-extension/src/index.ts calls
# `second_brain vmem store` (src/vmem.ts runVmemStore) with SMALL structured
# reference objects the extension already computes at three real call
# sites — AutoInject delivery (delivery_id/packet_tokens only), an
# RTD-preserved artifact pointer (sha256/size metadata only, never raw or
# distilled tool text), and the pre-compaction ledger checkpoint outcome.
# Never the memory/prompt/tool text itself. INDEPENDENT of [vmem].enabled
# (that toggle is compact-prep/hot-context bookkeeping only). Fail-open: a
# failing admission call only records an extension_error, never blocks the
# session. Rollback = set back to false (no redeploy needed, per-event read).
enabled = false

[context_structure]
# Context structural telemetry (pilot-2 prep, RC4 amendment).
# ENFORCED when enabled=true: brainstem/prime-extension/src/index.ts's
# `context` handler additionally calls sensors.contextStructure(), which
# records ONLY the per-element JS value type, an object's OWN top-level key
# NAMES (never values), a short recognized role/kind TOKEN (never arbitrary
# text), and sizes/lengths (never serialized text). NEVER prompt/tool
# content, thinking text, or any unrecognized string. Additive to the
# existing unconditional messages.length-only `context` record above; never
# replaces it. Rollback = set back to false (no redeploy needed, per-event
# read).
enabled = false

[context_paging]
# Context Virtual Memory pager — first conservative {messages} replacement
# patch (RC4 pass, Parts B-E). ENFORCED when enabled=true:
# brainstem/prime-extension/src/index.ts's `context` handler calls
# context-paging.ts's pageContext(), which may replace ONLY the `content`
# field of two eligible element classes (real schema captured in pilot 2,
# outputs/reports/rc4/12-real-prime-pilot-2.md): an AutoInject
# `brain.autoinject.packet` custom message whose delivery_id resolves to a
# currently-EVICTED RESEARCH_RESULT VMem object, or a toolResult whose
# toolCallId resolves to a currently-EVICTED TOOL_OBSERVATION VMem object
# (correlated via [vmem_admission]'s `--metadata` extension). Every other
# element — assistant turns, thinking/toolCall blocks, compactionSummary,
# any other custom message, any errored toolResult — is never touched.
# INDEPENDENT of [vmem]/[vmem_admission]/[context_structure] (all four may
# need to be true for paging to have anything to page, but this is its own
# top-level switch). Fail-open: any error anywhere in the eligibility/
# correlation/patch path returns the untouched original messages and
# records an extension_error — pageContext() itself never throws. Zero
# mutation when no eligible cold item exists (returns undefined, not an
# identical-looking patch). Rollback = set back to false (no redeploy
# needed, per-event read).
enabled = false
# Never page any of the LAST N elements of event.messages (current-turn
# pin window — generous headroom by default so nothing from the live
# exchange is ever touched).
pin_recent_messages = 6
# Page nothing until the ESTIMATED total size (~4 chars/token, VMem's own
# _estimate_tokens-style heuristic) of eligible OLD content exceeds this
# budget.
resident_token_budget = 4000
# Hard cap on how many elements may be replaced in a single `context` call,
# regardless of how many are eligible.
max_pages_per_context_event = 3

[reserve]
# Completion Reserve / Memory Budget Ceiling (v4.2 §95.1).
# ENFORCED: retrieved_memory_pct_max is read at runtime by
# semantic.load_retrieval_config as the retrieval token-budget hard ceiling
# (percent of the _CONTEXT_WINDOW_TOKENS = 200k assumption in semantic.py;
# lowest-value rows are trimmed after ranking, always keeping the best row).
# The remaining reserve keys are documented defaults; NOT WIRED yet.
task_execution_pct_min = 70      # current task/source/test execution
verification_reserve_pct = 5     # verification/recovery/handoff reserve
retrieved_memory_pct_max = 20    # max optional retrieved Brain context
degrade_order = ["tier4_memories", "tier3_memories", "dedupe_memories",
                 "shrink_scout_summaries", "offload_tool_history",
                 "keep_requirements", "keep_exact_source", "keep_tests_errors",
                 "keep_rollback_state"]
