# session-retention.toml — P2 session retention (plan §12/§13; Phase G/T-G5)
# Status: ENFORCED by ledger.SessionLifecycle (read at purge time via
# ledger.load_retention_config; absent/invalid keys fail open to defaults).
schema_version = 1

[retention]
inactive_grace_minutes = 10080     # 7 days before finalization is due
max_single_session_bytes = 104857600   # 100 MiB per session ledger+objects
max_total_session_bytes = 1073741824   # 1 GiB across all session ledgers
auto_extract_before_purge = true       # durable decisions extracted first
preserve_pinned = true                 # pinned sessions are never auto-purged
