# sleep.toml — replay/sleep defaults (Phase 14 consumes)
schema_version = 1

[engine]
mode = "manual"     # manual first, scheduled later (plan §53)
conservative_pass = true
creative_dream_pass = false   # candidate-only when enabled

[replay]
priorities = ["prediction_error", "user_correction", "verification_failure",
              "risk", "novelty", "reuse_potential", "uncertainty",
              "cross_project_relevance"]
interleave_older_cases = true   # never newest-only

[dream]
outputs_are_candidates_only = true
never_verified_facts = true
