# skills.toml — skill lifecycle defaults
# Status: [router].max_active is ENFORCED (router.py reads it per route() call,
# fallback 3; CLI --max-active overrides). All other keys remain documented
# defaults — no live runtime reader yet
# (see proof/reports/config-consumption.md).
schema_version = 1

[lifecycle]
stages = ["candidate", "shadow", "staged", "approved", "retired"]
adoption = ["shadow", "advisory", "active"]   # plan §57
scopes = ["global", "domain", "project", "model"]

[quality]
# every skill must carry these sections (plan §60)
required_sections = ["purpose", "positive_triggers", "negative_triggers",
                     "inputs", "procedure", "tools", "safety",
                     "verification", "output", "references"]

[gardener]
# periodic sweep targets (plan §62); bounded skill bank
sweep = ["dead_skills", "overlap", "false_triggers", "never_used",
         "negative_roi", "duplicates", "too_broad", "too_narrow",
         "model_specific_quirks"]

[router]
max_active = 3      # ENFORCED — router.py resolves [router] max_active from this
                    # file per route() call (invalid/absent -> 3); CLI --max-active
                    # overrides it (Phase 13)

# Lean Code Runtime Kernel activation (plan §11 / §24)
# ENFORCED — lean_runtime.py reads [lean] eval per event (fallback inert)
[lean]
eval = "advisory"

